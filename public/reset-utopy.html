<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset UTOPY local</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:720px;margin:48px auto;padding:20px;line-height:1.5}
    .ok{padding:18px;border-radius:16px;background:#eefbf1;border:1px solid #b8e8c2}
    code{background:#f3f3f3;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <div class="ok">
    <h1>UTOPY local reiniciado</h1>
    <p>Se eliminó únicamente la caché viva <code>mt.web.liveDatos</code>.</p>
    <p>No se borró tu identidad ni otras preferencias.</p>
  </div>
  <script>
    localStorage.removeItem("mt.web.liveDatos");
  </script>
</body>
</html>
